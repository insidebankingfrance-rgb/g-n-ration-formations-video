name: Générer la vidéo de formation

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Fichier source (.pptx ou .pdf) à la racine du repo"
        required: true
        default: "Paris 1 - Devenir une machine sur LinkedIn.pdf"
      pages:
        description: "Filtre 1-indexé des pages (ex : 1,2,9-11). Vide = tout le support."
        required: false
        default: "1,2,9,10,11"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Étape 1/3 - Extraire le contenu et rendre les slides en images
        run: |
          python src/pipeline.py prepare "${{ github.event.inputs.source }}" \
            ${{ github.event.inputs.pages && format('--pages {0}', github.event.inputs.pages) || '' }}

      - name: Vérifier que la narration existe
        run: |
          if [ ! -f data/narration.json ]; then
            echo "::error::data/narration.json est absent du repo. Écris-le d'abord avant de lancer ce workflow."
            exit 1
          fi

      - name: Étape 2/3 - Générer les clips avatar (D-ID) puis assembler la vidéo
        env:
          D_ID_API_KEY: ${{ secrets.D_ID_API_KEY }}
          D_ID_VOICE_ID: fr-FR-DeniseNeural
          AVATAR_IMAGE_PATH: assets/avatar/presentateur.jpg
        run: python src/pipeline.py generate

      - name: Étape 3/3 - Publier la vidéo générée comme artéfact
        uses: actions/upload-artifact@v4
        with:
          name: formation-video
          path: output/formation.mp4
          if-no-files-found: error
